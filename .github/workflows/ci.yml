name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - vic2/integration
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (types, lint, unit, e2e)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Local S3 emulator, as in development (buckets vic-local-private and vic-local-public on :9090).
      s3:
        image: adobe/s3mock:3.12.0
        env:
          initialBuckets: vic-local-private,vic-local-public
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # test/setup-env.ts loads .env, then .env.test (committed), then generates the JWT keys and
      # AUTH_TOKEN_KEY in memory and picks one database per Jest worker (vic_test_<worker>).
      - name: Write .env for the tests
        run: |
          cat > .env <<'EOF'
          NODE_ENV=local
          PORT=3000
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres
          DATABASE_NAME=vic
          DATABASE_TEST_NAME=vic_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          CACHE_TTL=60
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=1000
          MAIL_HOST=localhost
          MAIL_PORT=1025
          MAIL_USER=ci
          MAIL_PASS=ci
          MAIL_FROM=no-reply@vic.test
          MAIL_CONTACT=contact@vic.test
          AWS_ACCESS_KEY_ID=ci
          AWS_SECRET_ACCESS_KEY=ci
          AWS_REGION=eu-west-1
          AWS_S3_BUCKET_NAME=vic-local-private
          AWS_S3_BUCKET_NAME_PUBLIC=vic-local-public
          AWS_S3_ENDPOINT=http://localhost:9090
          AWS_S3_PUBLIC_BUCKET=vic-local-public
          AWS_S3_PUBLIC_BASE_URL=http://localhost:9090/vic-local-public
          EXPO_PUSH_NOTIFICATIONS_ACCESS_TOKEN=ci
          EOF

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx jest --maxWorkers=2

      - name: Wait for the S3 emulator
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/vic-local-public >/dev/null && exit 0
            sleep 2
          done
          echo "S3 emulator did not start" && exit 1

      - name: E2E tests
        run: npx jest --config ./test/jest-e2e.json --maxWorkers=2

  frontend:
    name: Frontend (types, lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type check and build
        run: npm run build

  mobile:
    name: Mobile (types, lint, tests)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx jest --maxWorkers=2
